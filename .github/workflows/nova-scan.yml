name: nova-live-scan
on:
  schedule:
    - cron: "*/5 3-10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: nova-scan
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova-order-block
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scan_job.py
      - run: |
          git config user.name "nova-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "data $(date -u +%H:%M)" || exit 0
          git push origin HEAD:nova-order-block
